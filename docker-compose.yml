version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bdms_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: bdms
    volumes:
      - mongodb_data:/data/db
    networks:
      - bdms_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bdms_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/bdms?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - bdms_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bdms_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - bdms_network

volumes:
  mongodb_data:

networks:
  bdms_network:
    driver: bridge
